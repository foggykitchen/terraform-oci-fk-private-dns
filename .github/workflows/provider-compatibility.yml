name: OCI 9 compatibility
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        root: ["examples/01-basic-private-zone", "examples/02-private-zone-with-compute", "."]
    env:
      TF_IN_AUTOMATION: "1"
      TF_INPUT: "0"
      OCI9_ALLOW_UNRELEASED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.11.6
          tofu_wrapper: false
      - name: Format, initialize, validate and mocked plan
        run: python3 scripts/oci9_check.py --root '${{ matrix.root }}'
